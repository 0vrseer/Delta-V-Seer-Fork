- type: entity
  parent: BaseSimpleMob
  id: MobCrystalSoul
  name: soul crystal
  description: Contains a soul. Placeholder sprite.
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _DV/CosmicCult/Mobs/wisp.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: wisp
      shader: unshaded
  - type: Speech
    speechSounds: Alto
    speechVerb: Ghost
    allowedEmotes: []
  - type: Psionic
  - type: SoulCrystal
  - type: Body
    prototype: Animal
  - type: TypingIndicator
    proto: alien
  - type: DamageStateVisuals
    states:
      Alive:
        Base: wisp
      Critical:
        Base: wisp
      Dead:
        Base: wisp
  - type: BlockMovement
  - type: PointLight
    color: "#43286a"
    radius: 2.25
    energy: 12
    castShadows: false
  - type: LightBehaviour
    behaviours:
    - !type:FadeBehaviour
      interpolate: Linear
      minDuration: 5.5
      maxDuration: 5.5
      startValue: 4
      endValue: 12
      property: Energy
      enabled: true
      isLooped: true
      reverseWhenFinished: true
  - type: SolutionContainerManager
    solutions:
      ectoplasm:
        maxVol: 25
        reagents:
        - ReagentId: Ectoplasm
          Quantity: 25
  - type: Extractable
    grindableSolutionName: ectoplasm
  - type: GuideHelp
    guides:
    - AltarsGolemancy
